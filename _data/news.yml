- date: "Feb 2026"
  text: "Our research on earable acoustic sensing of cognitive load was featured by [Scimex (Science Media Exchange)](https://www.scimex.org/newsfeed/earbuds-can-be-used-to-monitor-brain-health-new-research-finds) and [Ingenium (Official Press of the University of Melbourne)](https://eng.unimelb.edu.au/ingenium/health-technologies/earbuds-can-be-used-to-monitor-brain-health-new-research-finds), highlighting the potential of everyday earbuds for real-time brain health monitoring. [Paper](https://doi.org/10.1145/3714394.3756157)"
