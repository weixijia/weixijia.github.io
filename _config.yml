title: "Xijia Wei"
description: "PhD candidate at UCL working on machine learning for multimodal human sensing in healthcare."
url: "https://www.xijiawei.com"
baseurl: ""
repository: "weixijia/weixijia.github.io"

author:
  name: "Xijia Wei"
  email: "weixijia@outlook.com"
  scholar: "https://scholar.google.com/citations?hl=en&user=C1p76VgAAAAJ"
  github: "https://github.com/weixijia"
  orcid: "https://orcid.org/0000-0003-4745-6569"

# output: true only so jekyll-redirect-from can serve each item's legacy
# permalink as a redirect (redirect_to in front matter) to the list pages.
collections:
  publications:
    output: true
  talks:
    output: true
  teaching:
    output: true
  experience:
    output: true

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - DESIGN.md
  - LICENSE
  - vendor
  - .omc

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
encoding: "utf-8"
